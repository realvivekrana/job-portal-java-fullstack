spring.application.name=jobportal
server.port=8080

# Active profile (dev / prod). Real values go in application-dev.properties
# (gitignored) or in environment variables. Never commit secrets here.
spring.profiles.active=dev

# JPA
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# File upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# Secrets: set JWT_SECRET (Base64, at least 32 bytes) and the ADMIN_* values as
# environment variables, or put app.jwt.secret / app.admin.* in application-dev.properties.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=86400000
app.admin.name=${ADMIN_NAME:Admin}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Uploads and CORS defaults
app.upload.resume-dir=${UPLOAD_RESUME_DIR:uploads/resumes}
app.upload.logo-dir=${UPLOAD_LOGO_DIR:uploads/logos}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Email sender (SMTP host/user/password stay in the profile file or env variables)
app.mail.from=${MAIL_FROM:}